<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette Table</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #07130e;
    color: white;
    font-family: Arial, sans-serif;
  }

  .game {
    width: min(900px, 95vw);
    padding: 24px;
    border-radius: 20px;
    background: linear-gradient(145deg, #123d29, #071d14);
    border: 2px solid #d5ad42;
    box-shadow: 0 20px 60px #0008;
    text-align: center;
  }

  h1 { color: #ffd75a; margin: 0 0 6px; }
  .subtitle { color: #b8c9c0; margin-bottom: 20px; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .stat {
    background: #06150f;
    border: 1px solid #315b46;
    border-radius: 12px;
    padding: 10px 18px;
  }

  .stat span { color: #ffd75a; font-weight: bold; }

  .wheel-area {
    display: flex;
    justify-content: center;
    margin: 10px auto 24px;
  }

  .wheel-wrap {
    position: relative;
    width: 300px;
    height: 300px;
  }

  .pointer {
    position: absolute;
    z-index: 5;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 32px solid #ffd75a;
    filter: drop-shadow(0 2px 2px #000);
  }

  #wheel {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 10px solid #d5ad42;
    box-shadow: 0 0 0 5px #4b3210, 0 10px 30px #000;
    transition: transform 4s cubic-bezier(.12,.75,.18,1);
    background:
      conic-gradient(
        #111 0deg 18deg, #c92828 18deg 36deg,
        #111 36deg 54deg, #c92828 54deg 72deg,
        #111 72deg 90deg, #c92828 90deg 108deg,
        #111 108deg 126deg, #c92828 126deg 144deg,
        #111 144deg 162deg, #c92828 162deg 180deg,
        #111 180deg 198deg, #c92828 198deg 216deg,
        #111 216deg 234deg, #c92828 234deg 252deg,
        #111 252deg 270deg, #c92828 270deg 288deg,
        #111 288deg 306deg, #c92828 306deg 324deg,
        #111 324deg 342deg, #08783e 342deg 360deg
      );
      position: relative;
  }

  #wheel::after {
    content: "♠";
    position: absolute;
    inset: 25%;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #102c20;
    border: 5px solid #d5ad42;
    font-size: 42px;
    color: #ffd75a;
  }

  .controls {
    background: #06150f;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid #315b46;
  }

  .label {
    display: block;
    margin-bottom: 8px;
    color: #cbdad2;
  }

  .chips, .colors {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
  }

  button {
    border: 0;
    cursor: pointer;
    font-weight: bold;
    color: white;
    min-width: 55px;
    min-height: 44px;
    border-radius: 10px;
    transition: .15s;
  }

  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(1px); }

  .chip {
    background: #e4b832;
    color: #211700;
    border-radius: 50%;
    width: 52px;
    min-width: 52px;
    height: 52px;
    border: 4px dashed #fff8;
  }

  .chip.selected {
    outline: 4px solid white;
    transform: scale(1.1);
  }

  .red { background: #c92828; }
  .black { background: #171717; border: 1px solid #777; }
  .green { background: #08783e; }

  .color.selected {
    outline: 3px solid #ffd75a;
  }

  #spin {
    width: min(300px, 100%);
    margin-top: 5px;
    background: linear-gradient(#ffd75a, #b67d11);
    color: #241800;
    font-size: 18px;
    padding: 14px;
  }

  #spin:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  #result {
    min-height: 55px;
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    background: #102c20;
    color: #fff;
  }

  .bad {
    color: #ff7777;
    font-weight: bold;
  }

  .good {
    color: #71efaa;
    font-weight: bold;
  }

  #modifier {
    margin-top: 10px;
    color: #ff9e9e;
  }

  .history {
    margin-top: 18px;
    color: #9eb2a8;
    font-size: 13px;
  }
</style>
</head>

<body>
<div class="game">
  <h1>🎰 ROYALE ROULETTE</h1>
  <div class="subtitle">Pick a color, wager virtual chips, and spin.</div>

  <div class="stats">
    <div class="stat">Chips: <span id="chips">100</span></div>
    <div class="stat">Bet: <span id="bet">0</span></div>
    <div class="stat">Wins: <span id="wins">0</span></div>
    <div class="stat">Losses: <span id="losses">0</span></div>
  </div>

  <div class="wheel-area">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div id="wheel"></div>
    </div>
  </div>

  <div class="controls">
    <span class="label">Choose your chip:</span>
    <div class="chips">
      <button class="chip" data-value="1">1</button>
      <button class="chip" data-value="5">5</button>
      <button class="chip" data-value="10">10</button>
      <button class="chip" data-value="25">25</button>
      <button class="chip" data-value="50">50</button>
    </div>

    <span class="label">Bet on a color:</span>
    <div class="colors">
      <button class="color red" data-color="red">RED</button>
      <button class="color black" data-color="black">BLACK</button>
      <button class="color green" data-color="green">GREEN</button>
    </div>

    <button id="spin">SPIN THE WHEEL</button>

    <div id="result">Place a bet to begin.</div>
    <div id="modifier"></div>

    <div class="history">
      Virtual chips only • No real-money gambling
    </div>
  </div>
</div>

<script>
(() => {
  const wheel = document.getElementById("wheel");
  const chipsEl = document.getElementById("chips");
  const betEl = document.getElementById("bet");
  const winsEl = document.getElementById("wins");
  const lossesEl = document.getElementById("losses");
  const result = document.getElementById("result");
  const modifier = document.getElementById("modifier");
  const spinBtn = document.getElementById("spin");

  let chips = 100;
  let bet = 0;
  let selectedColor = null;
  let selectedChip = 1;
  let rotation = 0;
  let wins = 0;
  let losses = 0;

  const badModifiers = [
    "🐌 SLOW: Your next spin costs an extra 5 chips.",
    "💸 TAXED: Lose 10 additional chips.",
    "😵 DIZZY: Your next bet is capped at 5 chips.",
    "🪨 HEAVY: You can't bet 25 or 50 chips on the next spin.",
    "🔥 HOT HAND GONE WRONG: Lose another 5 chips.",
    "🔒 LOCKED: Your next win pays only 1×.",
    "🎲 CURSED: Your next spin has a completely random color.",
    "🥀 UNLUCKY: Your next bet costs 2× the selected chip amount."
  ];

  function update() {
    chipsEl.textContent = chips;
    betEl.textContent = bet;
    winsEl.textContent = wins;
    lossesEl.textContent = losses;
  }

  document.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedChip = Number(btn.dataset.value);
      bet = selectedChip;
      betEl.textContent = bet;
    });
  });

  document.querySelectorAll(".color").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".color").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedColor = btn.dataset.color;
      result.textContent = `Betting ${bet} chip${bet === 1 ? "" : "s"} on ${selectedColor.toUpperCase()}.`;
      modifier.textContent = "";
    });
  });

  spinBtn.addEventListener("click", () => {
    if (!selectedColor) {
      result.textContent = "Choose RED, BLACK, or GREEN first.";
      return;
    }

    if (bet <= 0 || bet > chips) {
      result.textContent = "You don't have enough chips for that bet.";
      return;
    }

    spinBtn.disabled = true;
    chips -= bet;
    update();

    const outcome = Math.floor(Math.random() * 37);
    const outcomeColor =
      outcome === 0 ? "green" : (outcome % 2 ? "red" : "black");

    // Put the selected roulette pocket under the pointer.
    const segment = 360 / 37;
    const target = 360 - (outcome * segment + segment / 2);
    rotation += 360 * 6 + target - (rotation % 360);

    wheel.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      if (outcomeColor === selectedColor) {
        wins++;

        // Green pays more; red/black pays 1:1.
        const payout = outcomeColor === "green" ? bet * 35 : bet * 2;
        chips += payout;

        result.innerHTML =
          `<span class="good">🎉 WIN!</span> The wheel landed on ` +
          `<b>${outcome === 0 ? "0 GREEN" : outcomeColor.toUpperCase()}</b>. ` +
          `You receive ${payout} chips.`;

        modifier.textContent = "";
      } else {
        losses++;

        const bad = badModifiers[
          Math.floor(Math.random() * badModifiers.length)
        ];

        result.innerHTML =
          `<span class="bad">💀 LOSS!</span> The wheel landed on ` +
          `<b>${outcome === 0 ? "0 GREEN" : outcomeColor.toUpperCase()}</b>.`;

        modifier.textContent = `BAD MODIFIER: ${bad}`;
      }

      update();
      spinBtn.disabled = false;
    }, 4100);
  });

  // Select 1 chip by default.
  document.querySelector(".chip").classList.add("selected");
  update();
})();
</script>
</body>
</html>
